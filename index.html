<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef"><title>Farm2Door</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark">🌱</span><span>Farm2Door<small>GROW LOCAL · SHOP LOCAL</small></span></a><div class="delivery-location"><strong>Delivery within 15 minutes</strong><button class="delivery-place" id="deliveryPlace" type="button" title="Use your current location" aria-label="Set delivery location to your current location"><svg class="location-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="deliveryPlaceLabel">Set your location</span><b aria-hidden="true">⌄</b></button></div><nav class="main-nav"><button class="nav-link active" data-page="home">Discover</button><button class="nav-link" data-page="orders">My orders</button><button class="nav-link" data-page="dashboard">Dashboard</button></nav><div class="top-actions"><button class="icon-button" id="notificationsBtn" aria-label="Notifications"><svg class="notification-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-dot"></span></button><button class="cart-button" id="cartBtn" aria-label="My Cart"><svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><span>My Cart</span><span id="cartCount">0</span></button><a class="account-name" id="accountName" href="login.html" aria-label="Open account profile">Sign in</a><a class="avatar" id="accountBtn" href="login.html" title="Account profile" aria-label="Account profile"><svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.2 20c.5-3.5 3.2-5.5 6.8-5.5s6.3 2 6.8 5.5"/></svg></a></div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NEIGHBORGOOD</p><h2 id="modalTitle">Your bag</h2></div><button class="icon-button close" id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script src="app.js"></script>
</body></html>
